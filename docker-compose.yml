version: "3.9"

services:
  data_ingestion_service:
    build:
      context: Backend/services/data_ingestion
      dockerfile: Dockerfile
    container_name: data_ingestion_service
    ports:
      - "8010:8010"
    volumes:
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/common:/app/common
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/data_ingestion/logs:/app/logs
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/data_ingestion/outputs/company_data:/app/outputs/company_data
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/data_ingestion/outputs/news:/app/outputs/news
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/data_ingestion/outputs/stock_data:/app/outputs/stock_data
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/data_ingestion/outputs/merged_source:/app/outputs/merged_source
    restart: unless-stopped

  embedding_service:
    build:
      context: Backend/services/embedding
      dockerfile: Dockerfile
    container_name: embedding_service
    ports:
      - "8030:8000"
    volumes:
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/common:/app/common
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/embedding/logs:/app/logs
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/data_ingestion/outputs/merged_source:/app/outputs/merged_source
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/db/chromadb:/app/chromadb
    depends_on:
      - data_ingestion_service
    restart: unless-stopped

  retrieval_service:
    build:
      context: Backend/services/retrieval
      dockerfile: Dockerfile
    container_name: retrieval_service
    ports:
      - "8070:8070"
    volumes:
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/common:/app/common
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/retrieval/logs:/app/logs
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/db/chromadb:/app/chromadb
    depends_on:
      - embedding_service
    restart: unless-stopped

  llm_service:
    build:
      context: Backend/services/llm
      dockerfile: Dockerfile
    container_name: llm_service
    ports:
      - "8081:8081"
    volumes:
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/common:/app/common
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/services/llm/logs:/app/logs
    depends_on:
      - retrieval_service
    restart: unless-stopped

  orchestrator_service:
    build:
      context: Backend
      dockerfile: Dockerfile.orchestrator
    container_name: orchestrator_service
    ports:
      - "8090:8090"
    volumes:
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/common:/app/common
      - /Users/sumanthg/Documents/sug/projects/Intelligent-investement-platform/Backend/logs:/app/logs
    depends_on:
      - retrieval_service
      - llm_service
    restart: unless-stopped
